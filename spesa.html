<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <script>try{var _t=JSON.parse(localStorage.getItem("wego_config")||"{}").theme||"dark";document.documentElement.setAttribute("data-theme",_t);if(document.querySelector('meta[name="theme-color"]'))document.querySelector('meta[name="theme-color"]').setAttribute("content",_t==="dark"?"#0F172A":"#F8FAFC")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Spesa — WeGo v3.8</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ─── PAGINA SENZA BARRA INFERIORE ───────────────────────────
       Più livelli forzavano un'altezza MINIMA pari a tutto il viewport
       (html/body/app-shell con min-height:100dvh, .page-content con
       flex:1 per riempire lo spazio restante). Su un form corto questo
       crea scroll "fantasma": la pagina viene resa alta come lo schermo
       anche se il contenuto reale è più corto, e su Chrome Android
       "100dvh" può risultare leggermente più alto dell'area visibile
       reale (barra indirizzi dinamica), aggiungendo scroll percepito
       anche a contenuto identico. Qui rimuoviamo lo stretch forzato a
       OGNI livello: la pagina sarà alta esattamente quanto il suo
       contenuto, non un pixel di più. Manteniamo lo sfondo coerente su
       html (di norma trasparente/bianco) per evitare un lampo di colore
       sbagliato nel caso il contenuto sia più corto del viewport. */
    html { background: var(--bg-primary); }
    body { min-height: auto !important; }
    .app-shell {
      min-height: 0 !important;
      height: auto !important;
    }
    .page-content {
      flex: 0 1 auto !important;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px) !important;
    }

    /* ─── IMPORTO HERO ─── */
    .amount-hero {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 16px;
      text-align: center;
    }
    .amount-hero__lbl {
      font-size: 11.5px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .amount-hero__wrap {
      display: flex; align-items: baseline;
      justify-content: center; gap: 4px;
    }
    .amount-hero__cur {
      font-size: 25.5px; font-weight: 600;
      color: var(--text-muted); line-height: 1;
    }
    .amount-hero__input {
      font-size: 44px; font-weight: 800;
      color: var(--text-primary); letter-spacing: -1px;
      background: none; border: none; outline: none;
      width: 190px; text-align: center;
      font-family: var(--font); -webkit-appearance: none;
      line-height: 1;
    }
    .amount-hero__input::placeholder { color: var(--border-strong); }

    /* ─── TYPE TOGGLE ─── */
    /* ─── TIPO (in riga con titolo Informazioni) ─── */
    .type-btn {
      height: 26px; padding: 0 7px;
      border-radius: var(--r-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-input);
      color: var(--text-muted);
      font-family: var(--font); font-size: 12.5px; font-weight: 600;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px;
      transition: all var(--ease);
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .type-btn svg { width: 11px; height: 11px; }
    .type-btn.active {
      border-color: var(--accent);
      background: rgba(59,130,246,0.09);
      color: var(--accent);
    }
    .type-btn.active-transfer {
      border-color: var(--purple);
      background: rgba(139,92,246,0.09);
      color: var(--purple);
    }
    /* "+Cassiere" — terza scelta, evidenziata in verde quando attiva
       (stesso pattern di .active/.active-transfer, colore diverso per
       distinguerla a colpo d'occhio, vedi "barretta verde" richiesta). */
    .type-btn.active-cashier {
      border-color: var(--green);
      background: rgba(16,185,129,0.1);
      color: var(--green);
    }

    /* ─── USO CASSA COMUNE: flag poco usato, etichetta + interruttore
       volutamente più piccoli (meno della metà) del font dell'importo
       (25.5px, vedi .amount-hero__input duplicato in #expenseAmount2) —
       interruttore "mini" derivato da .toggle/.toggle-slider (style.css)
       ma ridimensionato qui solo per questo contesto. ─── */
    .toggle--mini {
      width: 22px; height: 12px;
      margin-left: 0;
    }
    .toggle--mini .toggle-slider::before {
      width: 8px; height: 8px; left: 2px;
    }
    .toggle--mini input:checked + .toggle-slider::before {
      left: calc(100% - 10px);
    }

    /* ─── FORM CARD ─── */
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    /* Riga titolo card + controlli a destra */
    .form-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .form-card-title {
      font-size: 11.5px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin: 0;
    }
    .form-card-title-only { margin-bottom: 8px; }

    /* ─── PARTICIPANTS ─── */
    .part-grid {
      display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px;
    }

    /* ─── GPS ROW compatta ─── */
    .gps-row {
      display: flex; align-items: center; gap: 8px;
    }
    .gps-label {
      font-size: 11.5px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      white-space: nowrap; flex-shrink: 0;
    }
    .loc-bar {
      flex: 1; display: flex; align-items: center; gap: 6px;
      padding: 6px 9px;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: border-color var(--ease);
      min-width: 0;
    }
    .loc-bar:hover { border-color: var(--accent); }
    .loc-bar__text { flex: 1; font-size: 14px; color: var(--text-primary); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .loc-bar__text.ph { color: var(--text-muted); }

    /* ─── PHOTO ROW compatta ─── */
    .photo-row {
      display: flex; align-items: center; gap: 10px;
    }
    .photo-thumb {
      width: 48px; height: 48px;
      border-radius: var(--r-md); overflow: hidden;
      position: relative; background: var(--bg-input);
      flex-shrink: 0; display: none;
    }
    .photo-thumb.visible { display: block; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb__rm {
      position: absolute; top: 2px; right: 2px;
      width: 16px; height: 16px;
      background: rgba(0,0,0,0.7); border: none;
      border-radius: 50%; color: #fff; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; line-height: 1;
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-header__logo">
      <button class="btn btn--icon" onclick="SpesaApp.goBack()" title="Torna indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="app-header__title" id="pageTitle">Nuova spesa</span>
    </div>
    <div class="app-header__actions">
      <!-- Visibili solo in modalità SOLA LETTURA (view mode) -->
      <button class="btn btn--ghost btn--sm" id="headerEditBtn" style="display:none;" onclick="SpesaApp.enterEditMode()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Modifica
      </button>
      <button class="btn btn--sm" id="headerDeleteBtn" style="display:none;background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.3);" onclick="SpesaApp.deleteExpense()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        </svg>
        Elimina
      </button>
      <!-- Visibile in modalità NUOVA SPESA o MODIFICA -->
      <button class="btn btn--primary btn--sm" id="saveBtn" onclick="SpesaApp.save()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        Salva
      </button>
    </div>
  </header>

  <!-- IMPORTO ORIGINALE: nascosto, usato solo da JS per compatibilità -->
  <div class="amount-hero" style="display:none;">
    <div class="amount-hero__lbl">Importo</div>
    <div class="amount-hero__wrap">
      <span class="amount-hero__cur" id="currencySymbol">€</span>
      <input type="number" class="amount-hero__input" id="expenseAmount"
        placeholder="0,00" step="0.01" min="0" inputmode="decimal"
        onfocus="this.select()" />
    </div>
  </div>

  <main class="page-content" style="padding-top:6px;">

    <!-- INFO BASE: titolo + bottoni tipo sulla stessa riga -->
    <div class="form-card">
      <div class="form-card-header">
        <span class="form-card-title">Informazioni</span>
        <div style="display:flex;gap:3px;">
          <button class="type-btn active" id="typeExpense" onclick="SpesaApp.setType('expense')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            Spesa
          </button>
          <button class="type-btn" id="typeTransfer" onclick="SpesaApp.setType('transfer')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
            Trasf.
          </button>
          <button class="type-btn" id="typeCashier" onclick="SpesaApp.setType('cashier')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v10"/>
              <polyline points="8 9 12 13 16 9"/>
              <rect x="3" y="16" width="18" height="4" rx="1"/>
            </svg>
            +Cassiere
          </button>
        </div>
      </div>

      <!-- PREVISIONE: spesa futura, non va divisa né conteggiata nei saldi
           — solo per il tipo "Spesa" (vedi SpesaApp.setType che la nasconde
           per "Trasf."/"+Cassiere"). Di default spenta.
           Tutta su una riga (etichetta + nota + interruttore) — vedi
           anche _activateViewMode() in spesa.js per il fix del checkbox
           nativo che "ricompariva" fuori posizione in sola lettura. -->
      <div id="forecastRow" style="display:flex;align-items:center;gap:8px;padding:6px 0 12px;white-space:nowrap;">
        <span style="font-size:15px;font-weight:600;color:var(--text-primary);flex-shrink:0;">Previsione</span>
        <span style="font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">Spesa futura, non divisa ora</span>
        <label class="toggle" style="flex-shrink:0;margin-left:0;">
          <input type="checkbox" id="forecastToggle" onchange="SpesaApp.toggleForecast(this.checked)" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="form-group">
        <label class="form-label" id="descLabel">Descrizione *</label>
        <input type="text" class="form-input" id="expenseTitle"
          placeholder="es. Cena al ristorante" maxlength="80" autocomplete="off" />
      </div>
      <!-- DATA + METODO su una riga compatta: etichetta inline con campo -->
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:nowrap;">
        <label class="form-label" style="flex-shrink:0;margin:0;white-space:nowrap;">Data</label>
        <input type="date" class="form-input" id="expenseDate"
          style="flex:1;min-width:130px;max-width:175px;padding:6px 6px;font-size:14px;" />
        <label class="form-label" style="flex-shrink:0;margin:0 0 0 4px;white-space:nowrap;">Metodo</label>
        <select class="form-select" id="expenseMethod"
          style="flex:1;min-width:80px;padding:6px 24px 6px 8px;font-size:15px;"></select>
      </div>
    </div>

    <!-- IMPORTO: label + simbolo + campo su una riga -->
    <div class="form-card" style="padding:12px 14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:15px;font-weight:700;color:var(--text-muted);letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;">Importo</span>
        <span id="currencySymbol2" style="font-size:21px;font-weight:700;color:var(--text-secondary);">&#8364;</span>
        <input type="number" id="expenseAmount2"
          placeholder="0,00" step="0.01" min="0" inputmode="decimal"
          onfocus="this.select()"
          style="width:140px;min-width:80px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--r-md);padding:8px 10px;font-size:25.5px;font-weight:800;color:var(--text-primary);outline:none;text-align:right;" />
        <!-- USO CASSA COMUNE: solo per il tipo "Spesa" (nascosta/forzata
             spenta per "Trasf."/"+Cassiere" — vedi SpesaApp.setType).
             Etichetta sopra, interruttore sotto, entrambi più piccoli
             (meno della metà) del font dell'importo — flag poco usato,
             vedi situazione.md. Di default spento. -->
        <div id="cassaComuneRow" style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-left:auto;flex-shrink:0;">
          <span style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.2px;text-align:center;line-height:1.15;max-width:60px;">Uso Cassa Comune</span>
          <label class="toggle toggle--mini">
            <input type="checkbox" id="cassaComuneToggle" onchange="SpesaApp.toggleCassaComune(this.checked)" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <!-- TIPO (categoria di spesa) — solo per il tipo "Spesa", gestita
           liberamente da Impostazioni → Categorie spesa. Facoltativo.
           Select più corta (non più flex:1): occupa solo lo spazio che
           le serve, subito a destra dell'etichetta, tutto su una riga. -->
      <div id="categoryRow" style="display:flex;align-items:center;gap:6px;margin-top:10px;">
        <label class="form-label" style="flex-shrink:0;margin:0;white-space:nowrap;">Tipo</label>
        <select class="form-select" id="expenseCategory"
          style="width:auto;min-width:90px;max-width:150px;padding:6px 22px 6px 8px;font-size:15px;"></select>
      </div>
    </div>

    <!-- PAGANTE: etichetta PAGA inline con select, poi DIVIDE TRA a destra
         (per "+Cassiere" le stesse etichette diventano "A:"/"Da *" — vedi
         SpesaApp.setType) -->
    <div class="form-card" id="sectionExpense">
      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <!-- PAGA / A: label + select inline -->
        <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
          <label class="form-label" id="paidByLabel" style="margin:0;white-space:nowrap;">Paga:</label>
          <select class="form-select" id="expensePaidBy"
            style="width:auto;min-width:90px;max-width:130px;padding:5px 22px 5px 7px;font-size:15px;"></select>
        </div>
        <!-- DIVIDE TRA / DA: label + bottoni Tutti/Nessuno -->
        <div style="flex:1;min-width:120px;" id="divideTraWrap">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
            <label class="form-label" id="divideTraLabel" style="margin:0;">Divide tra *</label>
            <div style="display:flex;gap:3px;">
              <button class="btn btn--ghost btn--sm" style="height:22px;padding:0 6px;font-size:11.5px;" onclick="SpesaApp.selectAllParticipants()">Tutti</button>
              <button class="btn btn--ghost btn--sm" style="height:22px;padding:0 6px;font-size:11.5px;" onclick="SpesaApp.deselectAllParticipants()">Nessuno</button>
            </div>
          </div>
        </div>
      </div>
      <div class="part-grid" id="participantsGrid"></div>
      <div id="sharePreview" style="margin-top:6px;font-size:13px;color:var(--text-muted);text-align:center;"></div>
    </div>

    <!-- TRASFERIMENTO -->
    <div class="form-card" id="sectionTransfer" style="display:none;">
      <div class="form-card-title">Trasferimento diretto</div>
      <div class="form-group">
        <label class="form-label">Da (chi paga) *</label>
        <select class="form-select" id="transferFrom"></select>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">A (chi riceve) *</label>
        <select class="form-select" id="transferTo"></select>
      </div>
    </div>

    <!-- POSIZIONE compatta: GPS [campo] [mappa] [×] -->
    <div class="form-card" style="padding:8px 12px;">
      <div class="gps-row">
        <span class="gps-label">GPS</span>
        <div class="loc-bar" id="locationBar" onclick="SpesaApp.getLocation()">
          <span class="loc-bar__text ph" id="locationText">Tocca per rilevare</span>
          <a id="locationMapsLink" href="#" target="_blank" rel="noopener"
            style="display:none;color:var(--accent);flex-shrink:0;line-height:1;"
            onclick="event.stopPropagation()" title="Apri su Google Maps">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="10" r="3"/>
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
              <path d="M9 20l3 2 3-2"/>
            </svg>
          </a>
          <button id="locationClear" style="display:none;background:none;border:none;color:var(--text-muted);cursor:pointer;padding:1px;line-height:1;"
            onclick="SpesaApp.clearLocation(event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- FOTO: bottone + thumbnail inline, senza titolo separato -->
    <div class="form-card" style="padding:8px 12px;">
      <div class="photo-row">
        <button class="btn btn--ghost btn--sm" id="photoPickBtn" onclick="SpesaApp.pickPhoto()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
          Foto Scontrino
        </button>
        <input type="file" id="photoInput" accept="image/*" capture="environment"
          style="display:none;" onchange="SpesaApp.onPhotoChange(this)" />
        <!-- Miniatura subito a destra del bottone — cliccabile per lightbox -->
        <div id="photoPreviewWrap" style="display:none;">
          <div class="photo-thumb visible" onclick="SpesaApp.openPhotoLightbox()" style="cursor:pointer;" title="Apri a schermo intero">
            <img id="photoPreviewImg" src="" alt="Scontrino" />
            <button class="photo-thumb__rm" onclick="event.stopPropagation();SpesaApp.removePhoto()">×</button>
          </div>
        </div>
      </div>
    </div>

    <!-- NOTE + SALVA affiancati -->
    <div class="form-card" style="padding:8px 12px;">
      <div style="display:flex;align-items:stretch;gap:8px;">
        <textarea class="form-textarea" id="expenseNotes"
          placeholder="Note…" style="min-height:62px;margin-bottom:0;flex:1;resize:none;font-size:15px;"></textarea>
        <button id="saveSpeaBtn" class="btn btn--primary" onclick="SpesaApp.save()"
          style="flex-shrink:0;width:58px;height:auto;min-height:62px;padding:6px 4px;white-space:normal;text-align:center;line-height:1.3;font-size:14px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Salva
        </button>
      </div>
    </div>

    <!-- ELIMINA (solo in modifica) -->
    <button class="btn btn--danger btn--full" id="deleteBtn" onclick="SpesaApp.deleteExpense()" style="margin-top:8px;margin-bottom:28px;display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
      </svg>
      Elimina movimento
    </button>

  </main>
</div>

<!-- LIGHTBOX FOTO (spesa.html) — si apre cliccando la miniatura -->
<div id="spesaPhotoLightbox"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:2000;flex-direction:column;align-items:center;justify-content:center;"
  onclick="SpesaApp.closePhotoLightbox()">
  <button onclick="SpesaApp.closePhotoLightbox()"
    style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:25.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">&times;</button>

  <div id="spesaLightboxDeleteWrap" style="display:none;margin-top:18px;">
