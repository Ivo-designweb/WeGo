<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Riepilogo — WeGo v2.2</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ─── EVENT SELECTOR ─── */
    .event-selector {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .event-selector::-webkit-scrollbar { display: none; }

    .ev-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-input);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--ease);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .ev-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .ev-pill__dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
    }

    /* ─── TOTALE HERO ─── */
    .totale-hero {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 14px 14px 16px;
    }
    .totale-hero__label {
      font-size: 10px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 4px;
    }
    .totale-hero__amount {
      font-size: 28px; font-weight: 800;
      color: var(--text-primary); letter-spacing: -0.8px;
    }
    .totale-hero__meta {
      font-size: 11px; color: var(--text-muted);
      margin-top: 3px;
    }
    .totale-hero__stats {
      display: flex; gap: 1px;
      background: var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
      margin-top: 12px;
    }
    .totale-hero__stat {
      flex: 1; background: var(--bg-input);
      padding: 8px 6px; text-align: center;
    }
    .totale-hero__stat-val {
      font-size: 13px; font-weight: 700;
      color: var(--text-primary);
    }
    .totale-hero__stat-lbl {
      font-size: 9px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.4px;
      margin-top: 1px;
    }

    /* ─── SALDO ROW ─── */
    .saldo-row {
      display: flex; align-items: center;
      gap: 9px; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .saldo-row:last-child { border-bottom: none; }
    .saldo-row__info { flex: 1; min-width: 0; }
    .saldo-row__name {
      font-size: 13px; font-weight: 600;
      color: var(--text-primary);
    }
    .saldo-row__detail {
      font-size: 10px; color: var(--text-muted);
      margin-top: 1px;
    }
    .saldo-row__bar-wrap {
      width: 80px; height: 4px;
      background: var(--border);
      border-radius: var(--r-full);
      overflow: hidden; margin-top: 5px;
    }
    .saldo-row__bar {
      height: 100%;
      border-radius: var(--r-full);
      transition: width 0.4s ease;
    }
    .saldo-row__amount {
      font-size: 14px; font-weight: 700;
      text-align: right; white-space: nowrap;
      letter-spacing: -0.2px;
    }

    /* ─── TX CARD ─── */
    .tx-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .tx-card.mine { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.04); }
    .tx-card.mine-receive { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.04); }

    .tx-card__row1 {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 8px;
    }
    .tx-arrow {
      display: flex; align-items: center;
      gap: 4px; flex: 1; min-width: 0;
    }
    .tx-arrow__line {
      flex: 1; height: 1px;
      background: var(--border-strong);
      position: relative;
    }
    .tx-arrow__line::after {
      content: '';
      position: absolute; right: -1px; top: -3px;
      width: 0; height: 0;
      border-left: 5px solid var(--border-strong);
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
    }

    .tx-card__row2 {
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .tx-card__amount {
      font-size: 16px; font-weight: 800;
      color: var(--red); letter-spacing: -0.3px;
    }
    .tx-card__amount.receive { color: var(--green); }

    /* ─── SETTLED ITEM ─── */
    .settled-item {
      display: flex; align-items: center;
      gap: 9px; padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .settled-item:last-child { border-bottom: none; }
    .settled-item__check {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(16,185,129,0.15);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .settled-item__check svg { width: 10px; height: 10px; color: var(--green); }
    .settled-item__body { flex: 1; min-width: 0; }
    .settled-item__desc { font-size: 12px; font-weight: 500; color: var(--text-primary); }
    .settled-item__meta { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .settled-item__amount { font-size: 13px; font-weight: 700; color: var(--green); }

    /* ─── SPESE TABLE ─── */
    .spese-table { width: 100%; border-collapse: collapse; }
    .spese-table th {
      font-size: 9.5px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.5px; padding: 6px 0;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .spese-table th:last-child { text-align: right; }
    .spese-table td {
      font-size: 12px; color: var(--text-primary);
      padding: 8px 0; border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .spese-table tr:last-child td { border-bottom: none; }
    .spese-table td:last-child { text-align: right; font-weight: 600; }

    /* ─── EMPTY ─── */
    .riepilogo-empty {
      text-align: center; padding: 40px 20px;
      color: var(--text-muted); font-size: 13px;
    }

    /* ─── TABS ─── */
    .r-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      position: sticky;
      top: var(--nav-h);
      z-index: 50;
    }
    .r-tab {
      flex: 1; padding: 9px 4px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      font-family: var(--font); font-size: 11.5px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      transition: all var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .r-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ─── SHARE BUTTON ─── */
    .share-footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex; gap: 8px;
      position: fixed; bottom: var(--tab-h); left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: var(--max-w);
      z-index: 80;
    }
    @supports (padding: env(safe-area-inset-bottom)) {
      .share-footer {
        bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<div class="sync-bar hidden" id="syncBar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M21 12a9 9 0 11-6.219-8.56"/>
  </svg>
  <span>Sincronizzazione…</span>
</div>

<div class="app-shell">

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-header__logo">
      <a href="/index.html" class="btn btn--icon" title="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div class="app-header__logo-mark">WG</div>
      <span class="app-header__title">Riepilogo</span>
    </div>
    <div class="app-header__actions">
      <div id="connDot" style="width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;"></div>
      <button class="btn btn--icon" onclick="RiepilogoApp.syncNow()" title="Sincronizza">
        <svg id="syncIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 12v-1a8 8 0 0114.93-4M20 12v1a8 8 0 01-14.93 4"/>
          <polyline points="20 4 20 8 16 8"/><polyline points="4 20 4 16 8 16"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- SELETTORE EVENTO -->
  <div class="event-selector" id="eventSelector">
    <!-- Generato da JS -->
  </div>

  <!-- TOTALE HERO -->
  <div class="totale-hero" id="totaleHero">
    <div class="totale-hero__label">Totale spese evento</div>
    <div class="totale-hero__amount" id="heroAmount">—</div>
    <div class="totale-hero__meta" id="heroMeta">Caricamento…</div>
    <div class="totale-hero__stats">
      <div class="totale-hero__stat">
        <div class="totale-hero__stat-val" id="statSpese">—</div>
        <div class="totale-hero__stat-lbl">Spese</div>
      </div>
      <div class="totale-hero__stat">
        <div class="totale-hero__stat-val" id="statPartecipanti">—</div>
        <div class="totale-hero__stat-lbl">Persone</div>
      </div>
      <div class="totale-hero__stat">
        <div class="totale-hero__stat-val" id="statMedia">—</div>
        <div class="totale-hero__stat-lbl">Pro capite</div>
      </div>
      <div class="totale-hero__stat">
        <div class="totale-hero__stat-val" id="statPagamenti">—</div>
        <div class="totale-hero__stat-lbl">Saldati</div>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="r-tabs">
    <button class="r-tab active" id="tabSaldi"   onclick="RiepilogoApp.switchTab('saldi')">Saldi</button>
    <button class="r-tab"        id="tabDaSaldare" onclick="RiepilogoApp.switchTab('dasaldare')">Da saldare</button>
    <button class="r-tab"        id="tabSpese"   onclick="RiepilogoApp.switchTab('spese')">Spese</button>
    <button class="r-tab"        id="tabSaldati" onclick="RiepilogoApp.switchTab('saldati')">Già pagato</button>
  </div>

  <main class="page-content" style="padding-top:10px;padding-bottom:calc(var(--tab-h) + 58px);">

    <!-- TAB: SALDI -->
    <div id="panelSaldi">
      <div id="saldiList"></div>
    </div>

    <!-- TAB: DA SALDARE -->
    <div id="panelDasaldare" style="display:none;">
      <div id="daSaldareList"></div>
      <div id="daSaldareEmpty" class="riepilogo-empty" style="display:none;">
        <div style="font-size:22px;margin-bottom:8px;">✓</div>
        <div style="font-weight:600;color:var(--green);font-size:14px;">Tutti in pareggio!</div>
        <div style="margin-top:4px;font-size:12px;">Nessun debito pendente.</div>
      </div>
    </div>

    <!-- TAB: SPESE -->
    <div id="panelSpese" style="display:none;">
      <!-- Filtro pagante -->
      <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;">
        <button class="ev-pill active" id="filterAll" onclick="RiepilogoApp.filterExpenses(null)">Tutti</button>
        <div id="filterUsers" style="display:flex;gap:6px;"></div>
      </div>
      <div id="speseTableWrap"></div>
    </div>

    <!-- TAB: SALDATI -->
    <div id="panelSaldati" style="display:none;">
      <div id="saldatiList"></div>
      <div id="saldatiEmpty" class="riepilogo-empty" style="display:none;">
        <div style="font-size:12px;">Nessun pagamento registrato ancora.</div>
      </div>

      <!-- Pagamenti di cassa (movimenti tipo transfer) -->
      <div id="cassaSection" style="display:none;margin-top:20px;">
        <div style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;padding-top:12px;border-top:1px solid var(--border);">
          Movimenti di cassa
        </div>
        <div id="cassaList"></div>
      </div>
    </div>

  </main>

  <!-- BOTTOM SHARE BAR -->
  <div class="share-footer" style="display:flex;gap:8px;">
    <button class="btn btn--ghost" style="flex:1;" onclick="RiepilogoApp.shareRiepilogo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      Condividi riepilogo
    </button>
  </div>

</div>

<script src="/js/utils.js"></script>
<script src="/js/db.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/payments.js"></script>
<script src="/js/riepilogo.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => RiepilogoApp.init());</script>
</body>
</html>
