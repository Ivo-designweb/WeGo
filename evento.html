<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Evento — WeGo v1.6</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ─── HEADER COMPATTO CON FOTO+TITOLO+CODICE ─── */
    .ev-header-content {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .ev-header-photo {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--bg-input);
      flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    .ev-header-photo img { width: 100%; height: 100%; object-fit: cover; }
    .ev-header-title {
      font-size: 14px; font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 130px;
    }
    .ev-header-code {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 9.5px; font-weight: 700;
      letter-spacing: 1px; color: var(--accent);
      background: rgba(59,130,246,0.09);
      padding: 2px 6px; border-radius: var(--r-full);
      cursor: pointer; border: none; flex-shrink: 0;
      font-family: monospace;
      white-space: nowrap;
    }
    .ev-header-code:active { opacity: 0.7; }

    /* ─── TABS ─── */
    .tab-bar {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky; top: var(--nav-h); z-index: 50;
    }
    .tab-btn {
      flex: 1; padding: 10px 6px;
      background: none; border: none; border-bottom: 2px solid transparent;
      font-family: var(--font); font-size: 12px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      transition: all var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ─── SUMMARY ROW ─── */
    .summary-row {
      display: flex; gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .summary-row__item {
      flex: 1; background: var(--bg-secondary);
      padding: 9px 8px; text-align: center;
    }
    .summary-row__val {
      font-size: 14px; font-weight: 700;
      color: var(--text-primary); letter-spacing: -0.3px;
    }
    .summary-row__lbl {
      font-size: 9px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px;
      margin-top: 1px;
    }

    /* ─── MY QUOTA ─── */
    .my-quota {
      display: flex; align-items: center; gap: 8px;
      background: rgba(59,130,246,0.08);
      border-bottom: 1px solid rgba(59,130,246,0.15);
      padding: 8px 14px; font-size: 12px; color: var(--text-secondary);
    }

    /* ─── EXPENSE ITEM ─── */
    .exp-group-date {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 0 4px;
    }
    .exp-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .exp-item:last-child { border-bottom: none; }
    .exp-item:active { opacity: 0.7; }
    .exp-avatar { flex-shrink: 0; }
    .exp-info { flex: 1; min-width: 0; }
    .exp-title {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .exp-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; flex-wrap: wrap; }
    .exp-meta-txt { font-size: 10px; color: var(--text-muted); }
    .exp-badge {
      font-size: 9px; font-weight: 700; padding: 1px 5px;
      border-radius: 4px; background: var(--bg-input); color: var(--text-muted);
    }
    .exp-badge--sync { color: #D97706; background: rgba(245,158,11,0.12); }
    .exp-amount { flex-shrink: 0; text-align: right; }
    .exp-amount__val {
      font-size: 14px; font-weight: 700; color: var(--text-primary);
    }
    .exp-amount__lbl { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    /* ─── PARTECIPANTE ─── */
    .part-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .part-item:last-child { border-bottom: none; }
    .part-info { flex: 1; }
    .part-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .part-sub  { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .part-balance { font-size: 13px; font-weight: 700; text-align: right; flex-shrink: 0; }

    /* ─── SALDI ─── */
    .balance-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .balance-item:last-child { border-bottom: none; }
    .balance-info { flex: 1; }
    .balance-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .balance-bar-wrap { height: 4px; background: var(--bg-input); border-radius: 2px; margin-top: 5px; }
    .balance-bar { height: 100%; border-radius: 2px; transition: width 0.4s; }
    .balance-val { font-size: 14px; font-weight: 700; text-align: right; flex-shrink: 0; }

    .txn-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .txn-item:last-child { border-bottom: none; }
    .txn-text { flex: 1; font-size: 13px; color: var(--text-primary); line-height: 1.4; }
    .txn-amount { font-size: 14px; font-weight: 700; color: var(--text-primary); flex-shrink: 0; }

    /* ─── CONTEXT MENU ─── */
    .ctx-menu {
      position: fixed; top: calc(var(--nav-h) + 4px); right: 10px;
      background: var(--bg-card); border: 1px solid var(--border-strong);
      border-radius: var(--r-lg); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 200; min-width: 190px;
      display: none;
      overflow: hidden;
    }
    .ctx-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 12px 14px;
      background: none; border: none; border-bottom: 1px solid var(--border);
      font-family: var(--font); font-size: 13px; font-weight: 500;
      color: var(--text-primary); cursor: pointer; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .ctx-item:last-child { border-bottom: none; }
    .ctx-item:active { background: var(--bg-secondary); }
    .ctx-item svg { flex-shrink: 0; }
    .ctx-item.danger { color: var(--red); }
    .ctx-item.hidden { display: none; }
    .ctx-divider { height: 1px; background: var(--border-strong); }

    /* ─── SETTLED LIST ─── */
    .settled-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .settled-item:last-child { border-bottom: none; }
    .settled-info { flex: 1; }
    .settled-text { font-size: 12px; color: var(--text-secondary); }
    .settled-meta { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .settled-amount { font-size: 13px; font-weight: 700; color: var(--green); flex-shrink: 0; }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<div class="sync-bar hidden" id="syncBar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M21 12a9 9 0 11-6.219-8.56"/>
  </svg>
  <span>Sincronizzazione…</span>
</div>

<div class="app-shell">

  <!-- HEADER COMPATTO: ← [foto] Titolo · CODICE -->
  <header class="app-header">
    <div class="app-header__logo" style="flex:1;min-width:0;">
      <a href="/index.html" class="btn btn--icon" title="Torna alla Home" onclick="EventoApp.goHome(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div class="ev-header-content">
        <div class="ev-header-photo" id="headerEventPhoto">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
        </div>
        <span class="ev-header-title" id="headerEventTitle">Caricamento…</span>
        <button class="ev-header-code" id="headerEventCode" onclick="EventoApp.copyCode()">
          <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          <span id="headerEventCodeText">—</span>
        </button>
      </div>
    </div>
    <div class="app-header__actions">
      <div id="connectionIndicator" style="width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;"></div>
      <button class="btn btn--icon" onclick="EventoApp.syncNow()" title="Sincronizza">
        <svg id="syncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 12v-1a8 8 0 0114.93-4M20 12v1a8 8 0 01-14.93 4"/>
          <polyline points="20 4 20 8 16 8"/><polyline points="4 20 4 16 8 16"/>
        </svg>
      </button>
      <button class="btn btn--icon" id="eventMenuBtn" onclick="EventoApp.toggleMenu()" title="Opzioni">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="5" r="1" fill="currentColor"/>
          <circle cx="12" cy="12" r="1" fill="currentColor"/>
          <circle cx="12" cy="19" r="1" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- CONTEXT MENU -->
  <div class="ctx-menu" id="eventMenu">
    <button class="ctx-item" onclick="EventoApp.shareEventCode()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      Condividi codice
    </button>
    <button class="ctx-item" onclick="EventoApp.shareViaWhatsApp()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      Condividi su WhatsApp
    </button>
    <button class="ctx-item" onclick="EventoApp.showAddUser()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      Aggiungi partecipante
    </button>
    <button class="ctx-item" onclick="EventoApp.goToRiepilogo()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
      </svg>
      Riepilogo saldi
    </button>
    <div class="ctx-divider"></div>
    <!-- Elimina evento: visibile solo al creatore (gestito da JS) -->
    <button class="ctx-item danger" id="ctxDeleteBtn" onclick="EventoApp.confirmDeleteEvent()" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
      Elimina evento
    </button>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabSpese" onclick="EventoApp.switchTab('spese')">
      Spese <span id="tabSpeseCount" style="opacity:0.6;"></span>
    </button>
    <button class="tab-btn" id="tabPartecipanti" onclick="EventoApp.switchTab('partecipanti')">
      Partecipanti <span id="tabPartCount" style="opacity:0.6;"></span>
    </button>
    <button class="tab-btn" id="tabSaldi" onclick="EventoApp.switchTab('saldi')">
      Saldi
    </button>
  </div>

  <main class="page-content" id="mainContent">

    <!-- TAB SPESE -->
    <div id="panelSpese">
      <div class="my-quota" id="myQuota" style="display:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="myQuotaText" style="font-weight:600;color:var(--text-primary);"></span>
      </div>

      <div class="summary-row" id="summaryRow">
        <div class="summary-row__item">
          <div class="summary-row__val" id="summaryTotal">—</div>
          <div class="summary-row__lbl">Totale</div>
        </div>
        <div class="summary-row__item">
          <div class="summary-row__val" id="summaryCount">—</div>
          <div class="summary-row__lbl">Spese</div>
        </div>
        <div class="summary-row__item">
          <div class="summary-row__val" id="summaryAvg">—</div>
          <div class="summary-row__lbl">Pro capite</div>
        </div>
      </div>

      <div id="expenseList" style="padding:0 0 80px;"></div>
    </div>

    <!-- TAB PARTECIPANTI -->
    <div id="panelPartecipanti" style="display:none;">
      <div id="partecipantiList" style="padding:0 0 80px;"></div>
      <div style="padding:4px 0 80px;">
        <button class="btn btn--ghost btn--full" onclick="EventoApp.showAddUser()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Aggiungi partecipante
        </button>
      </div>
    </div>

    <!-- TAB SALDI -->
    <div id="panelSaldi" style="display:none;">
      <div id="balanceList" style="padding:0;"></div>

      <div class="section-header" style="margin-top:16px;"><span class="section-title">Transazioni minime</span></div>
      <div id="transactionsList" style="margin-bottom:20px;"></div>

      <div class="section-header"><span class="section-title">Già pagato</span></div>
      <div id="settledList"></div>
      <div id="settledEmpty" class="empty-state" style="display:none;padding:16px;">
        <p class="empty-state__desc">Nessun pagamento registrato.</p>
      </div>
    </div>

  </main>

  <button class="fab" id="fabBtn" onclick="EventoApp.newExpense()" title="Nuova spesa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <nav class="bottom-nav">
    <a href="/index.html" class="bottom-nav__item" onclick="EventoApp.goHome(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a href="#" class="bottom-nav__item active" onclick="return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span class="bottom-nav__label">Evento</span>
    </a>
    <a href="#" class="bottom-nav__item" onclick="EventoApp.goToRiepilogo();return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
      </svg>
      <span class="bottom-nav__label">Saldi</span>
    </a>
  </nav>
</div>

<!-- MODAL: AGGIUNGI PARTECIPANTE -->
<div class="modal-backdrop" id="modalAddUser" onclick="EventoApp.closeModal('modalAddUser')">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="bottom-sheet__handle"></div>
    <h2 class="bottom-sheet__title">Aggiungi partecipante</h2>
    <div class="form-group">
      <label class="form-label">Nome / Nickname *</label>
      <input type="text" class="form-input" id="newUserName" placeholder="es. Marco" maxlength="30"
        onkeydown="if(event.key==='Enter') EventoApp.addUser()" />
    </div>
    <button class="btn btn--primary btn--full btn--xl" onclick="EventoApp.addUser()">Aggiungi</button>
  </div>
</div>

<!-- MODAL: CAMBIA UTENTE -->
<div class="modal-backdrop" id="modalSwitchUser" onclick="EventoApp.closeModal('modalSwitchUser')">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="bottom-sheet__handle"></div>
    <h2 class="bottom-sheet__title">Chi sei?</h2>
    <div id="switchUserList" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
</div>

<!-- MODAL: DETTAGLIO SPESA -->
<div class="modal-backdrop" id="modalExpenseDetail" onclick="EventoApp.closeModal('modalExpenseDetail')">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="bottom-sheet__handle"></div>
    <div id="expenseDetailContent"></div>
  </div>
</div>

<!-- MODAL: REGISTRA PAGAMENTO -->
<div class="modal-backdrop" id="modalSettlePayment" onclick="EventoApp.closeModal('modalSettlePayment')">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="bottom-sheet__handle"></div>
    <h2 class="bottom-sheet__title">Registra pagamento</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Da</label>
        <select class="form-select" id="settleFrom"></select>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">A</label>
        <select class="form-select" id="settleTo"></select>
      </div>
    </div>
    <div class="form-group" style="margin-top:12px;">
      <label class="form-label">Importo *</label>
      <input type="number" class="form-input" id="settleAmount" placeholder="0,00" step="0.01" min="0.01" inputmode="decimal" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Metodo</label>
        <select class="form-select" id="settleMethod"></select>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Note</label>
        <input type="text" class="form-input" id="settleNote" placeholder="Opzionale" />
      </div>
    </div>
    <button class="btn btn--success btn--full btn--xl" onclick="EventoApp.confirmSettlePayment()" style="margin-top:14px;">
      Conferma pagamento
    </button>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/db.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/payments.js"></script>
<script src="/js/evento.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => EventoApp.init());</script>
</body>
</html>
